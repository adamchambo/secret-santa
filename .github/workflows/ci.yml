name: Deploy to Ubuntu

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  api-check:
    name: Check API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          cd ../db
          pnpm install --frozen-lockfile
          pnpm exec prisma generate

      - name: Typecheck API
        run: pnpm exec tsc --noEmit

      - name: Build API
        run: pnpm run build

  web-check:
    name: Build web app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web app
        run: pnpm lint

      - name: Build web app
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  deploy:
    name: Deploy on Ubuntu server
    runs-on: ubuntu-latest
    needs:
      - api-check
      - web-check

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd ~/apps/secret-santa

            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            corepack enable
            corepack prepare pnpm@10 --activate

            cd db
            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy

            cd ../api
            pnpm install --frozen-lockfile
            pnpm run build

            cd ../web
            pnpm install --frozen-lockfile
            pnpm run build

            pm2 restart secret-santa-api || pm2 start "pnpm start" \
              --name secret-santa-api \
              --cwd ~/apps/secret-santa/api

            pm2 restart secret-santa-web || pm2 start "pnpm start" \
              --name secret-santa-web \
              --cwd ~/apps/secret-santa/web

            pm2 save
